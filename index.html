<style>
  :root{

    --muted:#555;

    --page-bg:#e7e7e7;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--page-bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;}
  body{padding-bottom:80px;}
  .print-only{display:none;}

  .toolbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#222;color:#f2f2f2;
    padding:10px 18px;
    font-family:Arial,Helvetica,sans-serif;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .toolbar .brand{font-size:1.02rem;font-weight:700;letter-spacing:.02em;}
  .toolbar .brand small{display:block;font-weight:400;font-size:.62rem;letter-spacing:.1em;color:#bbb;margin-top:1px;}
  .toolbar .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    appearance:none;border:1px solid #555;background:#333;color:#f2f2f2;
    padding:8px 14px;font-family:inherit;font-size:.78rem;letter-spacing:.02em;
    border-radius:3px;cursor:pointer;transition:background .15s ease, transform .05s ease;
  }
  .btn:hover{background:#3f3f3f;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:#0a5b8a;border-color:#0a5b8a;color:#fff;}
  .btn.primary:hover{background:#0d6ea3;}
  .btn.ghost{background:transparent;}

  .doc-wrap{max-width:1000px;margin:26px auto;padding:0 16px;}

  .sheet{
    background:var(--paper);
    border:1px solid #ccc;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
    padding:0.4in 0.45in 0.35in;
    margin-bottom:34px;
    position:relative;
  }

  .doc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4pt;gap:10pt;}

  .doc-header .titles{flex:1 1 auto;text-align:center;min-width:0;}
  .doc-header .titles h1{font-size:13pt;margin:2pt 0 1pt;letter-spacing:.01em;font-weight:700;}
  .doc-header .titles h2{font-size:10.5pt;margin:0;font-weight:700;font-style:normal;color:#000;}
  .doc-header .meta{font-family:inherit;font-size:9.5pt;text-align:right;min-width:140px;flex:0 0 auto;}
  .doc-header .meta div{margin-bottom:4pt;display:flex;justify-content:flex-end;gap:5pt;align-items:baseline;}
  .doc-header .meta label{font-weight:700;}
  .doc-header .meta input{border:none;border-bottom:1px solid #000;background:transparent;font-family:inherit;font-size:9.5pt;padding:1px 2px;width:85px;text-align:center;color:#000;}

  h3.part{
    font-family:inherit;font-size:9.5pt;font-weight:700;letter-spacing:0;
    background:none;border:none;
    padding:2.5pt 0 1pt;margin:2.5pt 0 1pt;color:#000;
    display:flex;align-items:center;justify-content:space-between;gap:10pt;

    text-align:center;padding:1pt 3pt;cursor:pointer;
  }

  .inline-checks{display:flex;flex-wrap:wrap;gap:14pt;padding:0.5pt 0 2pt;font-family:inherit;font-size:9.5pt;}

  .bchk{
    display:inline-flex;align-items:baseline;cursor:pointer;user-select:none;
    font-family:inherit;font-weight:700;white-space:nowrap;color:#000;
  }
  .bchk .box{font-weight:700;}

  .row-inline{display:inline-flex;align-items:baseline;gap:4pt;white-space:nowrap;}

    background-image:repeating-linear-gradient(to bottom, transparent, transparent 17pt, #000 18pt);

  .signoff{margin-top:22pt;display:flex;justify-content:center;}

  .sig-tabs{display:flex;gap:6px;margin-bottom:6px;font-family:inherit;font-size:.68rem;justify-content:center;}

/* =========================================================

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function todayMD(){
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return mm + "/" + dd;
}
function nowTime(){
  const d = new Date();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if(h===0) h = 12;
  return String(h).padStart(2,'0') + ":" + m + " " + ampm;
}
function fullDate(){
  const d = new Date();
  return String(d.getMonth()+1) + "/" + String(d.getDate()) + "/" + String(d.getFullYear()).slice(-2);
}

function parseMD(str){
  if(!str) return null;
  const parts = str.trim().split("/");
  if(parts.length < 2) return null;
  const mo = parseInt(parts[0],10), da = parseInt(parts[1],10);
  if(isNaN(mo) || isNaN(da)) return null;
  let yr = new Date().getFullYear();
  if(parts.length >= 3){
    let y = parseInt(parts[2],10);
    if(!isNaN(y)) yr = y < 100 ? 2000+y : y;
  }
  const dt = new Date(yr, mo-1, da);
  if(isNaN(dt.getTime())) return null;
  return dt;
}

// Single unified "[ ] / [X]" bracket checkbox used everywhere on the form,
// matching the literal bracket checkboxes typed throughout the paper original.
function makeBracketCheck(){
  const box = el('span','bchk');
  box.setAttribute('data-state','');
  box.textContent = '[ ]';
  box.addEventListener('click', ()=>{
    const cur = box.getAttribute('data-state');
    const next = cur === '✓' ? '' : '✓';
    box.setAttribute('data-state', next);
    box.textContent = next === '✓' ? '[✓]' : '[x]' , '[ ]';
  });
  return box;
}

// bracket-checkbox + an editable text label, laid out inline
function makeCheckLabel(defaultLabel, rowClass){
  const row = el('div', rowClass || 'row-inline');
  const box = makeBracketCheck();
  const txt = document.createElement('input');
  txt.type = 'text';
  txt.className = 'lbl';
  txt.value = defaultLabel || '';
  row.appendChild(box);
  row.appendChild(txt);
  return {row, box, txt};
}

/* =========================================================
   BUILD A SHIFT SHEET
   ========================================================= */
function buildSheet(){
  const tpl = document.getElementById('tpl-sheet');
  const node = tpl.content.cloneNode(true);
  const root = node.querySelector('.sheet');

  const shiftSelect = root.querySelector('[data-role="shiftSelect"]');
  const shiftLabelEl = root.querySelector('[data-role="shiftLabel"]');
  const signCaptionEl = root.querySelector('[data-role="signCaption"]');
  function applyShift(){
    const val = shiftSelect.value;
    shiftLabelEl.textContent = val;
    const tag = val.indexOf('CLOSING') === 0 ? 'CLOSING' : 'OPENING';
    signCaptionEl.textContent = 'NAME AND SIGNATURE (' + tag + ')';
  }
  shiftSelect.addEventListener('change', applyShift);
  applyShift();

  root.querySelector('[data-role="headerDate"]').value = fullDate();
  root.querySelector('[data-role="headerTime"]').value = nowTime();

  // Part 1-3
  function fillInline(role, items){
    const holder = root.querySelector('[data-role="'+role+'"]');
    items.forEach(label=>{
      const {row} = makeCheckLabel(label, 'row-inline');
      holder.appendChild(row);
    });
  }
  fillInline('part1', PART1_ITEMS);
  fillInline('part2', PART2_ITEMS);
  fillInline('part3', PART3_ITEMS);

  // Part 4
  const p4body = root.querySelector('[data-role="part4body"]');
  PART4_ROWS.forEach(rowData=>{
    const tr = document.createElement('tr');

    const tdLoc = el('td','loc txtcell');
    const locInput = document.createElement('input'); locInput.type='text'; locInput.value = rowData.loc;
    tdLoc.appendChild(locInput);

    const tdCam = el('td','txtcell');
    const camInput = document.createElement('input'); camInput.type='text'; camInput.value = rowData.cam;
    tdCam.appendChild(camInput);

    const tdDate = el('td','txtcell');
    const dateInput = document.createElement('input'); dateInput.type='text'; dateInput.value = todayMD();
    tdDate.appendChild(dateInput);

    const tdTime = el('td','txtcell');
    const timeInput = document.createElement('input'); timeInput.type='text'; timeInput.value = nowTime();
    tdTime.appendChild(timeInput);

    const tdFrom = el('td','txtcell');
    const fromInput = document.createElement('input'); fromInput.type='text'; fromInput.placeholder='—';
    tdFrom.appendChild(fromInput);

    const tdTo = el('td','txtcell');
    const toInput = document.createElement('input'); toInput.type='text'; toInput.value = todayMD();
    tdTo.appendChild(toInput);

    const tdTotal = el('td','txtcell');
    const totalInput = document.createElement('input'); totalInput.type='text'; totalInput.placeholder='0';
    tdTotal.appendChild(totalInput);

    function recalcTotal(){
      const f = parseMD(fromInput.value);
      const t = parseMD(toInput.value);
      if(f && t){
        let diff = Math.round((t - f) / 86400000);
        if(diff < 0) diff += 365;
        totalInput.value = diff;
      }
    }
    dateInput.addEventListener('input', ()=>{ toInput.value = dateInput.value; recalcTotal(); });
    fromInput.addEventListener('input', recalcTotal);
    toInput.addEventListener('input', recalcTotal);

    let tdDsl2, tdDsl1;
    if(rowData.na){
      tdDsl2 = el('td','na-text-cell');
      tdDsl2.appendChild(el('span','na-text','N/A'));
      tdDsl1 = el('td','na-text-cell');
      tdDsl1.appendChild(el('span','na-text','N/A'));
    } else {
      tdDsl2 = el('td','toggle-cell'); tdDsl2.appendChild(makeBracketCheck());
      tdDsl1 = el('td','toggle-cell'); tdDsl1.appendChild(makeBracketCheck());
    }

    const tdHotline = el('td','hotline-cell');
    if(rowData.na){
      tdHotline.appendChild(el('span','na-text','N/A'));
    } else {
      const startList = rowData.hotlines.length ? rowData.hotlines : [''];
      startList.forEach(num=>{
        const {row} = makeCheckLabel(num, 'hotline-row');
        tdHotline.appendChild(row);
      });
    }
    const addBtn = document.createElement('button');
    addBtn.type='button'; addBtn.textContent='+ number'; addBtn.className='no-print';
    addBtn.style.cssText='margin-top:2px;font-size:.6rem;border:1px dashed #bbb;background:none;color:#888;cursor:pointer;border-radius:2px;padding:1px 5px;';
    addBtn.addEventListener('click', ()=>{
      const {row} = makeCheckLabel('', 'hotline-row');
      tdHotline.insertBefore(row, addBtn);
    });
    if(!rowData.na) tdHotline.appendChild(addBtn);

    tr.appendChild(tdLoc);
    tr.appendChild(tdCam);
    tr.appendChild(tdDate);
    tr.appendChild(tdTime);
    tr.appendChild(tdFrom);
    tr.appendChild(tdTo);
    tr.appendChild(tdTotal);
    tr.appendChild(tdDsl2);
    tr.appendChild(tdDsl1);
    tr.appendChild(tdHotline);
    p4body.appendChild(tr);
  });

  // Part 5
  const p5body = root.querySelector('[data-role="part5body"]');
  PART5_ROWS.forEach(rowData=>{
    const tr = document.createElement('tr');
    const tdLoc = el('td','loc');
    tdLoc.textContent = rowData.loc;

    const tdServer = document.createElement('td');
    const {row:srow} = makeCheckLabel(rowData.server, 'toggle-label-row');
    tdServer.appendChild(srow);

    const tdPos = document.createElement('td');
    rowData.pos.forEach(ip=>{
      const {row} = makeCheckLabel(ip, 'ip-line');
      tdPos.appendChild(row);
    });

    tr.appendChild(tdLoc);
    tr.appendChild(tdServer);
    tr.appendChild(tdPos);

    rowData.mp.forEach(label=>{
      const td = document.createElement('td');
      const {row} = makeCheckLabel(label || '', 'mp-cell');
      td.appendChild(row);
      tr.appendChild(td);
    });

    p5body.appendChild(tr);
  });

  // Check-all buttons (Part 4 / Part 5) — sets every bracket checkbox in the
  // target table to [X]; individual boxes can still be clicked to undo.
  root.querySelectorAll('.btn-checkall').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.getAttribute('data-target');
      root.querySelectorAll('[data-role="'+target+'"] .bchk').forEach(b=>{
        b.setAttribute('data-state','✓');
        b.textContent = '[✓]';
      });
    });
  });

  // Part 6
  const p6body = root.querySelector('[data-role="part6body"]');
  PART6_ROWS.forEach(rowData=>{
    const tr = document.createElement('tr');
    ['app','ip','link'].forEach(key=>{
      const td = document.createElement('td');
      const input = document.createElement('input'); input.type='text'; input.value = rowData[key];
      td.appendChild(input);
      tr.appendChild(td);
    });
    const tdStatus = document.createElement('td');
    const statusInput = document.createElement('input'); statusInput.type='text'; statusInput.placeholder='OK / Issue';
    tdStatus.appendChild(statusInput);
    tr.appendChild(tdStatus);
    p6body.appendChild(tr);
  });

  // Signature pad
  const canvas = root.querySelector('[data-role="sigCanvas"]');
  const clearBtn = root.querySelector('[data-role="sigClear"]');
  const upload = root.querySelector('[data-role="sigUpload"]');
  const preview = root.querySelector('[data-role="sigPreview"]');
  const tabs = root.querySelectorAll('.sig-tab');
  const panes = {
    draw: root.querySelector('[data-pane="draw"]'),
    upload: root.querySelector('[data-pane="upload"]')
  };
  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      Object.keys(panes).forEach(k=>panes[k].classList.toggle('hidden', k !== tab.dataset.tab));
    });
  });
  upload.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ preview.src = reader.result; preview.style.display='block'; };
    reader.readAsDataURL(file);
  });

  root.__initCanvas = function(){
    setupSignaturePad(canvas, clearBtn);
  };

  return root;
}

function setupSignaturePad(canvas, clearBtn){
  const ctx = canvas.getContext('2d');
  function resize(){
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';
  }
  resize();
  let drawing = false, last = null;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX - rect.left, y: p.clientY - rect.top};
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    canvas.classList.remove('blank');   // something was drawn -> include canvas in print
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    e.preventDefault();
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  clearBtn.addEventListener('click', ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    canvas.classList.add('blank');      // empty again -> hide canvas in print
  });
}

/* =========================================================
   MOUNT
   ========================================================= */
const reportSheet = buildSheet();
document.getElementById('mount-open').appendChild(reportSheet);
reportSheet.__initCanvas();

/* =========================================================
   TOOLBAR ACTIONS
   ========================================================= */
document.getElementById('printBtn').addEventListener('click', ()=> window.print());

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Reset all fields in this form? This cannot be undone.')) return;
  document.querySelectorAll('.doc-wrap input[type=text]').forEach(i=> i.value='');
  document.querySelectorAll('.doc-wrap textarea').forEach(t=> t.value='');
  document.querySelectorAll('.bchk').forEach(b=>{ b.setAttribute('data-state',''); b.textContent='[ ]'; });
  document.querySelectorAll('.sigpad').forEach(c=>{
    const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
    c.classList.add('blank');
  });
  document.querySelectorAll('.sig-preview').forEach(p=>{ p.style.display='none'; p.src=''; });
  document.querySelectorAll('[data-role="headerDate"]').forEach(i=> i.value = fullDate());
  document.querySelectorAll('[data-role="headerTime"]').forEach(i=> i.value = nowTime());
  document.querySelectorAll('[data-role="shiftSelect"]').forEach(sel=>{
    sel.selectedIndex = 0;
    sel.dispatchEvent(new Event('change'));
  });
  document.querySelectorAll('table.grid tbody tr').forEach((tr)=>{
    const dateInput = tr.children[2] && tr.children[2].querySelector('input');
    const toInput = tr.children[5] && tr.children[5].querySelector('input');
    if(dateInput) dateInput.value = todayMD();
    if(toInput) toInput.value = todayMD();
  });
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>
